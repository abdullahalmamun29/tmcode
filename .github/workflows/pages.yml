# Publishes the TmCode website and installers to GitHub Pages:
#   https://abdullahalmamun29.github.io/tmcode/            (site/index.html)
#   https://abdullahalmamun29.github.io/tmcode/install.sh  (macOS / Linux)
#   https://abdullahalmamun29.github.io/tmcode/install.ps1 (Windows)
# Runs whenever the page or the installers change on main.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp install.sh install.ps1 _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
