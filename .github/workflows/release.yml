# Builds TmCode for every OS and publishes a GitHub Release.
#
# To release:  bump `version` in pyproject.toml, commit, then
#   git tag v0.2.1 && git push origin v0.2.1
#
# Optional: also publish to PyPI automatically. On pypi.org, open the tmcode
# project → Publishing → add a "trusted publisher" (owner abdullahalmamun29,
# repo tmcode, workflow release.yml, environment pypi). Then in GitHub repo
# Settings → Secrets and variables → Actions → Variables, add
# PUBLISH_PYPI = true. No token needed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # "Run workflow" button: builds only, no release

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04       # Linux x86_64 (works on glibc 2.35+: Ubuntu 22.04, Mint 21, Debian 12 and newer)
          - ubuntu-22.04-arm   # Linux arm64
          - macos-15-intel     # macOS Intel
          - macos-14           # macOS Apple Silicon
          - windows-latest     # Windows x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: python packaging/build_binary.py
      - name: Smoke test
        run: build/pyinstaller/out/tmcode/tmcode --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/tmcode-*
          if-no-files-found: error

  python-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  release:
    needs: [binaries, python-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum tmcode-* > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "TmCode $GITHUB_REF_NAME"
          --generate-notes

  pypi:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
